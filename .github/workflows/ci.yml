name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: node scripts/package-smoke.mjs
      - name: Driver-1 testees
        run: |
          node node_modules/typescript/bin/tsc -p cmd/bitwire-testee/ts/tsconfig.json --noEmit
          node scripts/testee-smoke.mjs
          mkdir -p "$RUNNER_TEMP/packed"
          npm pack . --pack-destination "$RUNNER_TEMP/packed"
          node scripts/testee-package.mjs "$RUNNER_TEMP/packed"
          node scripts/testee-smoke.mjs "$RUNNER_TEMP"/packed/bitspark-bitruntime-[0-9]*.tgz "$RUNNER_TEMP"/packed/bitspark-bitruntime-testee-*.tgz
  interop:
    # bitruntime and nightseam v0.6.0, Go and TypeScript, in every pairing over
    # real WebSockets, and bitruntime's bytes against nightseam's.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            conformance/interop/nightseam/ts/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/interop.mjs
