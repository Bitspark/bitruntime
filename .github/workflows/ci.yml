name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Project names
        run: node scripts/naming.mjs
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: node scripts/package-smoke.mjs
      - run: node scripts/interop.mjs
      - run: node scripts/hydrated-interop.mjs
      # The release runs this against its tag; run it here against the pushed
      # commit so the public-module consumer is exercised on Linux before a tag.
      - name: Go module consumer from the pushed commit
        run: node scripts/go-smoke.mjs "${{ github.event.pull_request.head.sha || github.sha }}"
